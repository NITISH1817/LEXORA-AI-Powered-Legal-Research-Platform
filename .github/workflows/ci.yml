name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx
        
    - name: Run Pytest (Security & Auth)
      run: |
        pytest backend/tests/test_auth.py
        pytest backend/tests/test_rag.py
        
    - name: Run Evaluation Gate
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # Only run if GEMINI_API_KEY is available in CI
        if [ -n "$GEMINI_API_KEY" ]; then
          python -m evaluation.evaluator
          
          # Optional: Add script to parse evaluation/results/latest.json and exit 1 if regressions
          # e.g., if faithfulness < 0.85 then exit 1
        else
          echo "Skipping Evaluation Gate - No GEMINI_API_KEY secret provided."
        fi
